name: Build and publish release
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to rebuild (must match CURRENT_VERSION)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: guardtowarr-release
  cancel-in-progress: false
jobs:
  validate:
    permissions:
      contents: write  # GitHub requires write access to read an unpublished draft release.
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      stable: ${{ steps.version.outputs.stable }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -B -m unittest discover -s tests -v
      - run: python tools/check_frontend.py
      - id: version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python tools/release_version.py "$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          gh release view "$RELEASE_TAG" --json isPrerelease --jq '.isPrerelease' > prerelease.txt
          if [ "$(cat prerelease.txt)" = true ]; then echo 'stable=false' >> "$GITHUB_OUTPUT"; fi
  docker:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.tag }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: tags
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          STABLE: ${{ needs.validate.outputs.stable }}
        run: |
          echo 'tags<<EOF' >> "$GITHUB_OUTPUT"
          echo "tonytrawl/guardtowarr:$VERSION" >> "$GITHUB_OUTPUT"
          if [ "$STABLE" = true ]; then echo 'tonytrawl/guardtowarr:latest' >> "$GITHUB_OUTPUT"; fi
          echo 'EOF' >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.tags.outputs.tags }}
      - name: Verify published tags share the same manifest
        if: needs.validate.outputs.stable == 'true'
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          docker buildx imagetools inspect "tonytrawl/guardtowarr:$VERSION" --raw > version.json
          docker buildx imagetools inspect tonytrawl/guardtowarr:latest --raw > latest.json
          cmp version.json latest.json
      - name: Update Docker Hub description
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: python3 tools/publish_docker_description.py
  windows:
    needs: validate
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.tag }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: .\build.bat
        shell: cmd
      - name: Attach executable to release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: |
          $hash = (Get-FileHash dist/GuardTowarr.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  GuardTowarr.exe" | Set-Content dist/SHA256SUMS.txt
          gh release upload $env:RELEASE_TAG dist/GuardTowarr.exe dist/SHA256SUMS.txt --clobber
